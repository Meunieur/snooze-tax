<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="46" fill="url(#bgGrad)" stroke="#FBBF24" stroke-width="3"/>
  <!-- Alarm bells -->
  <circle cx="28" cy="20" r="10" fill="#F59E0B"/>
  <circle cx="72" cy="20" r="10" fill="#F59E0B"/>
  <rect x="47" y="14" width="6" height="10" fill="#CBD5E1" rx="3"/>
  <!-- Clock Face -->
  <circle cx="50" cy="54" r="32" fill="#0F172A"/>
  <!-- Dollar Sign in Center -->
  <text x="50" y="64" font-family="Arial, sans-serif" font-size="30" font-weight="900" fill="url(#goldGrad)" text-anchor="middle">$</text>
  <!-- Clock Hands -->
  <line x1="50" y1="54" x2="50" y2="34" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="54" x2="65" y2="54" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
  <circle cx="50" cy="54" r="3.5" fill="#FBBF24"/>
</svg>
