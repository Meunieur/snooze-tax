<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <!-- Dark Titanium Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E14"/>
      <stop offset="50%" stop-color="#07070A"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Cyber Gold -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Neon Crimson -->
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF453A"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>

    <!-- Bloom Filter -->
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Solid Background -->
  <rect width="1024" height="500" fill="url(#bgGrad)"/>

  <!-- Ambient Glow Background Orbs -->
  <circle cx="240" cy="250" r="200" fill="#EF4444" opacity="0.12" filter="url(#bloom)"/>
  <circle cx="850" cy="180" r="180" fill="#F59E0B" opacity="0.08" filter="url(#bloom)"/>

  <!-- Subtle Cyber Grid / Radar Rings -->
  <g opacity="0.25">
    <circle cx="240" cy="250" r="190" fill="none" stroke="#3F3F46" stroke-width="1.5" stroke-dasharray="8 8"/>
    <circle cx="240" cy="250" r="230" fill="none" stroke="#27272A" stroke-width="1"/>
    <line x1="0" y1="250" x2="1024" y2="250" stroke="#27272A" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.4"/>
    <line x1="240" y1="0" x2="240" y2="500" stroke="#27272A" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.4"/>
  </g>

  <!-- Cyber Bracket Accents on Corners -->
  <path d="M 30 70 L 30 30 L 70 30" fill="none" stroke="#FF453A" stroke-width="3" opacity="0.6"/>
  <path d="M 994 430 L 994 470 L 954 470" fill="none" stroke="#F59E0B" stroke-width="3" opacity="0.6"/>
  <path d="M 994 70 L 994 30 L 954 30" fill="none" stroke="#3F3F46" stroke-width="2" opacity="0.5"/>
  <path d="M 30 430 L 30 470 L 70 470" fill="none" stroke="#3F3F46" stroke-width="2" opacity="0.5"/>

  <!-- EMBED CONCEPT 3 ICON ON LEFT (Scaled & Centered at x=240, y=250) -->
  <g transform="translate(80, 90) scale(0.625)">
    <!-- Icon Container Squircle with Shadow -->
    <rect width="512" height="512" rx="115" fill="#09090D" stroke="#27272A" stroke-width="3"/>
    
    <!-- Concentric radar in icon -->
    <circle cx="256" cy="256" r="210" fill="none" stroke="#27272A" stroke-width="2" stroke-dasharray="6 6"/>
    
    <!-- Top Bell Arcs -->
    <path d="M 125 140 A 55 55 0 0 1 180 85" fill="none" stroke="url(#goldText)" stroke-width="18" stroke-linecap="round"/>
    <circle cx="125" cy="140" r="10" fill="url(#goldText)"/>

    <path d="M 387 140 A 55 55 0 0 0 332 85" fill="none" stroke="url(#goldText)" stroke-width="18" stroke-linecap="round"/>
    <circle cx="387" cy="140" r="10" fill="url(#goldText)"/>

    <!-- Main Ring (Crimson Neon) -->
    <circle cx="256" cy="275" r="145" fill="none" stroke="url(#crimsonGrad)" stroke-width="20" filter="url(#softGlow)"/>
    <circle cx="256" cy="275" r="145" fill="#0C0C0F"/>

    <!-- Center Monogram: The S-Dollar Fusion -->
    <g filter="url(#softGlow)">
      <text x="256" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial Black, sans-serif" font-size="190" font-weight="900" fill="url(#goldText)" text-anchor="middle" letter-spacing="-4">$</text>
    </g>

    <!-- Modern Clock Hands intersecting through the Dollar -->
    <g stroke-linecap="round">
      <line x1="256" y1="275" x2="195" y2="335" stroke="#FFFFFF" stroke-width="14"/>
      <line x1="256" y1="275" x2="256" y2="185" stroke="#FFFFFF" stroke-width="14"/>
      <circle cx="256" cy="275" r="12" fill="#FF3B30"/>
      <circle cx="256" cy="275" r="6" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- RIGHT SIDE: BRANDING & TYPOGRAPHY -->
  <g transform="translate(450, 0)">
    <!-- Pill Badge -->
    <g transform="translate(0, 95)">
      <rect width="210" height="32" rx="16" fill="rgba(239, 68, 68, 0.14)" stroke="rgba(239, 68, 68, 0.4)" stroke-width="1.5"/>
      <circle cx="18" cy="16" r="4.5" fill="#EF4444" filter="url(#softGlow)"/>
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#F87171" letter-spacing="1.5">HIGH-STAKES ALARM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="900" fill="#FFFFFF" letter-spacing="-1">
      Snooze Tax
    </text>

    <!-- Slogan / Subtitle in Neon Cyber Gold -->
    <text x="0" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="url(#goldText)" letter-spacing="2">
      PAY TO SLEEP  •  WAKE UP ON TIME
    </text>

    <!-- Value Proposition -->
    <text x="0" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" fill="#CBD5E1">
      The alarm clock where snoozing costs real money.
    </text>
    <text x="0" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#94A3B8">
      Discipline your mornings with real financial consequences.
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 360)">
      <!-- Tag 1 -->
      <g>
        <rect width="135" height="34" rx="10" fill="#18181B" stroke="#27272A" stroke-width="1"/>
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">💸 Pay-To-Snooze</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(145, 0)">
        <rect width="135" height="34" rx="10" fill="#18181B" stroke="#27272A" stroke-width="1"/>
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">🧠 Math Check</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(290, 0)">
        <rect width="135" height="34" rx="10" fill="#18181B" stroke="#27272A" stroke-width="1"/>
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">🗣️ Savage Roast</text>
      </g>
    </g>
  </g>
</svg>
