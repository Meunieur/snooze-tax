<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="30%" stop-color="#FCD34D"/>
      <stop offset="80%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#4C0519" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad2)"/>

  <!-- Ringing Vibration Shockwaves -->
  <path d="M 60 170 A 55 55 0 0 1 85 95" fill="none" stroke="#FDE047" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
  <path d="M 40 200 A 90 90 0 0 1 75 80" fill="none" stroke="#FFF" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  
  <path d="M 452 170 A 55 55 0 0 0 427 95" fill="none" stroke="#FDE047" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
  <path d="M 472 200 A 90 90 0 0 0 437 80" fill="none" stroke="#FFF" stroke-width="8" stroke-linecap="round" opacity="0.6"/>

  <!-- Clock Legs -->
  <line x1="150" y1="400" x2="110" y2="445" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
  <line x1="362" y1="400" x2="402" y2="445" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>

  <!-- Twin Golden Bells -->
  <g filter="url(#shadow2)">
    <circle cx="140" cy="140" r="50" fill="url(#gold2)"/>
    <circle cx="372" cy="140" r="50" fill="url(#gold2)"/>
    <!-- Hammer -->
    <rect x="244" y="90" width="24" height="42" rx="8" fill="#FFF"/>
  </g>

  <!-- Main Clock Body -->
  <g filter="url(#shadow2)">
    <!-- Crisp White Outer Ring -->
    <circle cx="256" cy="285" r="155" fill="#FFFFFF"/>
    <!-- Deep Obsidian Core -->
    <circle cx="256" cy="285" r="132" fill="#0F172A"/>
  </g>

  <!-- Cheeky Eyes: Dollar Signs with Sparkle -->
  <!-- Left Eye: Bold Dollar -->
  <text x="205" y="275" font-family="-apple-system, BlinkMacSystemFont, Arial Black, sans-serif" font-size="78" font-weight="900" fill="url(#gold2)" text-anchor="middle">$</text>
  <!-- Right Eye: Bold Dollar -->
  <text x="307" y="275" font-family="-apple-system, BlinkMacSystemFont, Arial Black, sans-serif" font-size="78" font-weight="900" fill="url(#gold2)" text-anchor="middle">$</text>

  <!-- Mischievous Grin / Smirk (Curved Clock Mouth) -->
  <path d="M 195 315 Q 256 365 317 315" fill="none" stroke="#FBBF24" stroke-width="12" stroke-linecap="round"/>

  <!-- Cheek Blushes (Glowing Pink) -->
  <ellipse cx="165" cy="310" rx="15" ry="9" fill="#FF453A" opacity="0.6"/>
  <ellipse cx="347" cy="310" rx="15" ry="9" fill="#FF453A" opacity="0.6"/>

  <!-- Floating Golden Coin Embers -->
  <circle cx="256" cy="40" r="16" fill="url(#gold2)"/>
  <text x="256" y="47" font-family="Arial Black" font-size="18" font-weight="900" fill="#78350F" text-anchor="middle">$</text>
</svg>
