<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C0F1D"/>
      <stop offset="50%" stop-color="#14172B"/>
      <stop offset="100%" stop-color="#080A12"/>
    </linearGradient>

    <!-- Clock Outer Ring Gradient -->
    <linearGradient id="redRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF453A"/>
      <stop offset="60%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </linearGradient>

    <!-- Gold Bell / Coin Gradient -->
    <linearGradient id="goldCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="35%" stop-color="#FBBF24"/>
      <stop offset="80%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- Inner Glow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Drop Shadow Filter -->
    <filter id="shadowFilter" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Squircle with App Store Radius -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad1)"/>

  <!-- Ambient Red Backlight Glow -->
  <circle cx="256" cy="275" r="160" fill="#EF4444" opacity="0.22" filter="url(#glowFilter)"/>
  <circle cx="256" cy="120" r="100" fill="#F59E0B" opacity="0.18" filter="url(#glowFilter)"/>

  <!-- ALARM CLOCK LEGS (Angled Stands) -->
  <line x1="140" y1="390" x2="105" y2="440" stroke="#475569" stroke-width="18" stroke-linecap="round"/>
  <line x1="372" y1="390" x2="407" y2="440" stroke="#475569" stroke-width="18" stroke-linecap="round"/>

  <!-- ALARM CLOCK BELLS (Golden Coins Style) with Shadows -->
  <g filter="url(#shadowFilter)">
    <!-- Left Golden Bell -->
    <ellipse cx="145" cy="140" rx="48" ry="48" fill="url(#goldCoin)" transform="rotate(-30 145 140)"/>
    <ellipse cx="145" cy="140" rx="38" ry="38" fill="none" stroke="#FEF08A" stroke-width="3" opacity="0.7"/>

    <!-- Right Golden Bell -->
    <ellipse cx="367" cy="140" rx="48" ry="48" fill="url(#goldCoin)" transform="rotate(30 367 140)"/>
    <ellipse cx="367" cy="140" rx="38" ry="38" fill="none" stroke="#FEF08A" stroke-width="3" opacity="0.7"/>

    <!-- Center Hammer / Handle -->
    <path d="M 230 115 C 230 90, 282 90, 282 115 Z" fill="#64748B"/>
    <rect x="246" y="95" width="20" height="35" rx="6" fill="#94A3B8"/>
  </g>

  <!-- MAIN CLOCK BODY -->
  <g filter="url(#shadowFilter)">
    <!-- Outer Crimson Ring -->
    <circle cx="256" cy="285" r="150" fill="url(#redRing)"/>
    <!-- Rim Highlight -->
    <circle cx="256" cy="285" r="148" fill="none" stroke="#FDA4AF" stroke-width="4" opacity="0.45"/>

    <!-- Dark Inner Clock Face -->
    <circle cx="256" cy="285" r="126" fill="#0A0D16"/>
  </g>

  <!-- GOLDEN TICK MARKS (Subtle Luxury) -->
  <circle cx="256" cy="178" r="4.5" fill="#FBBF24" opacity="0.6"/>
  <circle cx="363" cy="285" r="4.5" fill="#FBBF24" opacity="0.6"/>
  <circle cx="256" cy="392" r="4.5" fill="#FBBF24" opacity="0.6"/>
  <circle cx="149" cy="285" r="4.5" fill="#FBBF24" opacity="0.6"/>

  <!-- CENTER HERO: 3D GOLDEN DOLLAR SIGN -->
  <g filter="url(#glowFilter)">
    <!-- Bold Golden Dollar Sign Glow -->
    <text x="256" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Impact, Arial Black, sans-serif" font-size="160" font-weight="900" fill="url(#goldCoin)" text-anchor="middle">$</text>
  </g>

  <!-- CLOCK HANDS (Glowing Crimson & Gold pointing to 7:00 AM) -->
  <g stroke-linecap="round">
    <!-- Minute Hand (Pointing up to 12) -->
    <line x1="256" y1="285" x2="256" y2="200" stroke="#FF453A" stroke-width="11"/>
    <!-- Hour Hand (Pointing down-left to 7) -->
    <line x1="256" y1="285" x2="208" y2="345" stroke="#FF453A" stroke-width="11"/>
    <!-- Hand Accent Overlays -->
    <line x1="256" y1="285" x2="256" y2="208" stroke="#FECDD3" stroke-width="4"/>
    <line x1="256" y1="285" x2="212" y2="340" stroke="#FECDD3" stroke-width="4"/>
    
    <!-- Center Golden Pin -->
    <circle cx="256" cy="285" r="13" fill="url(#goldCoin)"/>
    <circle cx="256" cy="285" r="5" fill="#FFF"/>
  </g>

  <!-- SPARKS / FLYING COIN EMBERS (Viral energy) -->
  <circle cx="115" cy="80" r="5" fill="#FEF08A" opacity="0.8"/>
  <circle cx="400" cy="88" r="6" fill="#FBBF24" opacity="0.85"/>
  <circle cx="430" cy="140" r="3.5" fill="#FF453A" opacity="0.7"/>
</svg>
