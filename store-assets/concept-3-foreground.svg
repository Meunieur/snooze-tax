<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Titanium Gradient -->
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111116"/>
      <stop offset="50%" stop-color="#08080A"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Cyber Gold Gradient -->
    <linearGradient id="cyberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Neon Crimson Gradient -->
    <linearGradient id="neonRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>

    <filter id="bloom3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Full Bleed Background for Adaptive Icon Masking -->
  <rect width="512" height="512" fill="url(#bgGrad3)"/>

  <!-- Scaled Safe-Zone Group (70% centered at 256, 256) -->
  <g transform="translate(256, 256) scale(0.68) translate(-256, -256)">
    <!-- Subtle Concentric Radar Rings -->
    <circle cx="256" cy="256" r="210" fill="none" stroke="#27272A" stroke-width="2" stroke-dasharray="6 6"/>
    <circle cx="256" cy="256" r="160" fill="none" stroke="#27272A" stroke-width="1.5" opacity="0.5"/>

    <!-- Ambient Glow Core -->
    <circle cx="256" cy="256" r="140" fill="#EF4444" opacity="0.15" filter="url(#bloom3)"/>

    <!-- Top Bell Arcs -->
    <path d="M 125 140 A 55 55 0 0 1 180 85" fill="none" stroke="url(#cyberGold)" stroke-width="20" stroke-linecap="round"/>
    <circle cx="125" cy="140" r="11" fill="url(#cyberGold)"/>

    <path d="M 387 140 A 55 55 0 0 0 332 85" fill="none" stroke="url(#cyberGold)" stroke-width="20" stroke-linecap="round"/>
    <circle cx="387" cy="140" r="11" fill="url(#cyberGold)"/>

    <!-- Main Ring (Crimson Neon) -->
    <circle cx="256" cy="275" r="145" fill="none" stroke="url(#neonRed)" stroke-width="22" filter="url(#bloom3)"/>
    <circle cx="256" cy="275" r="145" fill="#0C0C0F"/>

    <!-- Center Monogram: The S-Dollar Fusion -->
    <g filter="url(#bloom3)">
      <text x="256" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial Black, sans-serif" font-size="190" font-weight="900" fill="url(#cyberGold)" text-anchor="middle" letter-spacing="-4">$</text>
    </g>

    <!-- Modern Clock Hands intersecting through the Dollar -->
    <g stroke-linecap="round">
      <line x1="256" y1="275" x2="195" y2="335" stroke="#FFFFFF" stroke-width="15"/>
      <line x1="256" y1="275" x2="256" y2="185" stroke="#FFFFFF" stroke-width="15"/>
      <circle cx="256" cy="275" r="13" fill="#FF3B30"/>
      <circle cx="256" cy="275" r="6.5" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
