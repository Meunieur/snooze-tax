name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../SnoozeTax.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnoozeTax-APK
          path: SnoozeTax.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Snooze Tax v1.0.0 - Android APK"
          body: |
            ⏰ **Snooze Tax - Báo Thức Phạt Tiền Quẹt Thẻ Apple Pay / Google Pay**
            
            Tải file `SnoozeTax.apk` bên dưới cài trực tiếp vào điện thoại Android để trải nghiệm cảm giác bị trừ $5 mỗi lần ngủ nướng!
          files: SnoozeTax.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
