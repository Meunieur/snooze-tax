name: Build Android APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Release Keystore
        run: |
          cd android/app
          if [ -f ../../snoozetax.jks ]; then
            cp ../../snoozetax.jks ./snoozetax.jks
          elif [ ! -f snoozetax.jks ]; then
            keytool -genkey -v -keystore snoozetax.jks -alias snoozetax -keyalg RSA -keysize 2048 -validity 10000 -storepass snoozetax123 -keypass snoozetax123 -dname "CN=SnoozeTax, OU=Dev, O=SnoozeTax, L=HN, S=HN, C=VN"
          fi

      - name: Build Android Bundle & APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease assembleRelease --stacktrace
          cp app/build/outputs/bundle/release/app-release.aab ../SnoozeTax-release.aab
          cp app/build/outputs/apk/release/app-release.apk ../SnoozeTax.apk
          cp app/snoozetax.jks ../snoozetax.jks

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SnoozeTax-Release-Files
          path: |
            SnoozeTax-release.aab
            SnoozeTax.apk
            snoozetax.jks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.4
          name: "Snooze Tax v1.0.4 - Target Android 16 (API 36) & Closed Beta Release"
          body: |
            ⏰ **Snooze Tax (Nice Alarm) - Production Release v1.0.3**
            
            Cập nhật mới:
            - Chuyển đổi ngôn ngữ song ngữ Toàn Cầu (English / Tiếng Việt).
            - Khắc phục triệt để lỗi giọng đọc AI TTS (Voice Fallback thông minh).
            - Tối ưu giao diện Apple Pay Face ID cực mượt.
            
            Các file đính kèm:
            - **`SnoozeTax-release.aab`**: File Bundle chính thức để upload lên Google Play Console!
            - **`SnoozeTax.apk`**: File cài đặt trực tiếp cho điện thoại Android.
            - **`snoozetax.jks`**: Khóa ký bảo mật ứng dụng (Keystore).
          files: |
            SnoozeTax-release.aab
            SnoozeTax.apk
            snoozetax.jks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
